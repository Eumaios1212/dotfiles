# Font settings
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 18

# Window appearance
initial_window_width 120c
initial_window_height 30
window_padding_width 5
background_opacity 1
repaint_delay 10

# Scrolling
scrollback_lines 10000

# Colors
foreground #d8d8d8
background #181818

color0 #181818
color1 #ac4242
color2 #90a959
color3 #f4bf75
color4 #6a9fb5
color5 #aa759f
color6 #75b5aa
color7 #d8d8d8

color8 #6b6b6b
color9 #c55555
color10 #aac474
color11 #feca88
color12 #82b8c8
color13 #c28cb8
color14 #93d3c3
color15 #f8f8f8

# Selection (inverted)
selection_foreground #181818
selection_background #d8d8d8

# Cursor (inverted, block, blinking)
cursor #d8d8d8
cursor_text_color #181818
cursor_shape block
cursor_blink_interval 750

# Mouse
hide_mouse_when_typing yes
copy_on_select primary
mouse_map right press ungrabbed paste_from_selection

# Bell
visual_bell_duration 0

# Miscellaneous
allow_remote_control yes
