# Font settings
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 18

# Window appearance
initial_window_width 120c
initial_window_height 30c
window_padding_width 5
background_opacity 1
repaint_delay 10

# Scrolling
scrollback_lines 10000

# Colors
foreground #d8d8d8
background #181818

color0 #181818
color1 #ac4242
color2 #90a959
color3 #f4bf75
color4 #6a9fb5
color5 #aa759f
color6 #75b5aa
color7 #d8d8d8

color8 #6b6b6b
color9 #c55555
color10 #aac474
color11 #feca88
color12 #82b8c8
color13 #c28cb8
color14 #93d3c3
color15 #f8f8f8

# Starship glyph optimization
symbol_map U+e0a0-U+e0a3,U+e0b0-U+e0c8,U+e700-U+e7c5,U+F000-U+F8FF FiraCode Nerd Font Mono
modify_font underline_position -2

# Selection (inverted)
selection_foreground #181818
selection_background #d8d8d8

# Cursor (inverted, block, blinking)
cursor #d8d8d8
cursor_text_color #181818
cursor_shape block
cursor_blink_interval 750

# Mouse
mouse_hide_wait 3.0
copy_on_select clipboard
mouse_map right press ungrabbed paste_from_clipboard

# Bell — disable audio and desktop notifications
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no
bell_on_tab "🔔 "

# Block OSC 99 desktop notifications (e.g., Claude Code "waiting for input")
# NOTE: needs a newer kitty than Ubuntu ships (0.32.2 has no filter_notification
# and silently ignores this line, so the notifications still get through).
filter_notification all

# Miscellaneous
allow_remote_control yes
# 2026-08-08: was `x11`, which forced kitty through XWayland and caused severe
# typing lag on 550's Wayland+NVIDIA session. `auto` = native Wayland here,
# X11 on hosts still running an X11 session. Revert to `x11` if a host regresses.
linux_display_server auto

# Tab bar
shell_integration no-prompt-mark
tab_bar_edge top
tab_bar_style separator
tab_separator "  │  "
tab_bar_min_tabs 1
tab_title_template "{title}"
active_tab_title_template "{title}"
